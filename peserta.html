<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Akun Peserta — MANASIK 3D</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4ef;color:#20382e;font:15px system-ui,sans-serif}header{background:#143d30;color:white;padding:24px 18px 32px}header div{max-width:1050px;margin:auto}header a{color:#e6d49b;text-decoration:none;font-size:13px}h1{font-size:clamp(28px,5vw,40px);letter-spacing:-.04em;margin:8px 0}p{line-height:1.55}main{max-width:1050px;padding:0 14px 32px;margin:-16px auto 0}.card{background:white;border:1px solid #dedfd6;border-radius:16px;padding:19px;margin:0 0 12px;box-shadow:0 4px 18px #213b2d08}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat{background:#edf4ed;border-radius:10px;padding:12px}.stat strong{display:block;font-size:25px}.muted{font-size:13px;color:#66796b}.tag{font-size:11px;letter-spacing:.12em;font-weight:800;color:#71846f}label{display:block;font-weight:700;font-size:13px;margin:10px 0 4px}input,select{width:100%;font:inherit;border:1px solid #cdd8ce;border-radius:9px;padding:11px;background:#fff;color:#20382e}input[type=color]{padding:3px;height:42px}input[type=checkbox]{width:auto;accent-color:#286847}button,.button{display:inline-block;background:#236748;color:white;border:0;border-radius:9px;padding:12px 15px;font:inherit;font-weight:750;text-decoration:none;text-align:center;cursor:pointer;margin:6px 5px 0 0}.secondary{background:#e7eee6;color:#244d38;border:1px solid #d5e3d4}.danger{background:#f3e7df;color:#8b382c}button:disabled{opacity:.5;cursor:default}.table{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:9px;border-bottom:1px solid #e6e9e4;text-align:left;white-space:nowrap}h2{font-size:21px;margin:4px 0 10px}h3{font-size:16px;margin:12px 0 5px}.notice{font-weight:700;color:#875022}.preview{padding:18px;border-radius:13px;color:white;background:#225a40;margin:10px 0;min-height:120px}.preview h3{font-size:20px;margin:7px 0}.preview img{max-height:55px;max-width:150px;object-fit:contain}.check{display:flex;gap:10px;align-items:start;font-weight:400}.check input{flex:none;margin-top:4px}.warning{background:#fcf3d7;border:1px solid #e9d7a1;border-radius:10px;padding:12px;font-size:13px}.links{display:flex;gap:8px;flex-wrap:wrap}a{color:#215d45}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #c79e57;outline-offset:3px}[hidden]{display:none!important}@media(max-width:650px){.grid{grid-template-columns:1fr}.stats{gap:5px}.stat{padding:9px}.stat strong{font-size:20px}.card{padding:15px}}</style></head><body><header><div><a href="./index.html">← MANASIK 3D • V3.0</a><h1>Akun Peserta</h1><p>Hubungkan progress latihan dengan travel yang dipilih.</p></div></header><main><section class="card"><h2 data-tenant-brand>MANASIK 3D</h2><p id="status" class="notice" role="status"></p><p id="demo" class="warning" hidden>Demo: tidak ada data peserta yang dikirim ke server. Data contoh saja.</p><form id="auth" hidden><label>Email</label><input type="email" name="email" required autocomplete="username"><label>Password</label><input name="password" type="password" required minlength="8" autocomplete="current-password"><button type="submit">Masuk</button><button type="submit" class="secondary" id="signup">Daftar akun</button></form><form id="enroll" hidden><label>Nama panggilan (opsional)</label><input id="alias" maxlength="80" placeholder="Peserta"><label class="check"><input type="checkbox" id="consent" required> Saya mengizinkan travel ini melihat nama panggilan dan progress tertinggi latihan umroh dan haji. Data tidak digunakan sebagai bukti sahnya ibadah.</label><button>Simpan izin</button></form><div id="actions" hidden><a class="button" href="./index.html">Mulai latihan</a><button id="withdraw" class="danger">Hapus data progress mitra</button><button id="logout" class="secondary">Keluar akun</button></div><a href="./index.html">Kembali ke simulator</a></section></main><script type="module" src="/src/peserta.ts"></script></body></html>
